[build-system]
requires = ["setuptools>=61.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cogworks-week2-vision-reference-app"
version = "0.1.0"
description = "Reynaldo's reference implementation for the CogWorks Week 2 vision capstone"
readme = "README.md"
requires-python = ">=3.8,<3.13"
license = { text = "MIT" }
authors = [{ name = "Reynaldo Jose Morillo Nolasco" }]
dependencies = ["numpy>=1.24,<2", "scikit-image>=0.21,<0.25"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.entry-points."cogworks.submissions.v2"]
vision-recognition = "benchmark_adapter:create_recognition_adapter"
vision-clustering = "benchmark_adapter:create_clustering_adapter"

[tool.setuptools]
py-modules = ["benchmark_adapter"]

[tool.setuptools.packages.find]
where = ["."]
include = ["face_recognition*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

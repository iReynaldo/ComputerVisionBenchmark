name: Real-data integration

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

jobs:
  public-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COGWORKS_REAL_DATA: "1"
      TORCH_HOME: ${{ github.workspace }}/.cache/torch
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - uses: actions/cache@v4
        with:
          path: |
            .cache/torch
            .cache/huggingface
            ~/.cache/cogworks
          key: week2-real-v1-${{ runner.os }}
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install -e ".[test,data]"
          -e "face_recognition_app[test]"
          numpy==1.24.4 Pillow==10.2.0 torch==2.2.2 torchvision==0.17.2
          facenet-pytorch==2.6.0 opencv-python-headless==4.10.0.84
          "facenet_models @ git+https://github.com/CogWorksBWSI/facenet_models.git@96b9599b03f26910b66f61ce725a8660e0ba654c"
      - run: /usr/bin/time -v pytest tests/integration/test_public_data.py -ra
